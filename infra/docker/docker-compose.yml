services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: hr_tool
      POSTGRES_USER: hr_tool
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr_tool -d hr_tool"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.backend
    environment:
      DATABASE_URL: postgresql+psycopg://hr_tool:${POSTGRES_PASSWORD}@db:5432/hr_tool
      PGVECTOR_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
  frontend:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.backend
    command: ["python", "-m", "backend.app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://hr_tool:${POSTGRES_PASSWORD}@db:5432/hr_tool
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
