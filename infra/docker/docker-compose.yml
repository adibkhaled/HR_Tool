services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: hr_tool
      POSTGRES_USER: hr_tool
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      APP_ENV: ${APP_ENV:?set APP_ENV}
      PGVECTOR_ENABLED: ${PGVECTOR_ENABLED:?set PGVECTOR_ENABLED}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:?set OBJECT_STORAGE_ENDPOINT}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:?set OBJECT_STORAGE_BUCKET}
      LLM_PROVIDER: ${LLM_PROVIDER:?set LLM_PROVIDER}
      LLM_MODEL: ${LLM_MODEL:?set LLM_MODEL}
      LLM_BASE_URL: ${LLM_BASE_URL:?set LLM_BASE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr_tool -d hr_tool"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.backend
    environment:
      APP_NAME: HR Talent Matching Platform
      APP_ENV: ${APP_ENV}
      DATABASE_URL: postgresql+psycopg://hr_tool:${POSTGRES_PASSWORD}@db:5432/hr_tool
      PGVECTOR_ENABLED: ${PGVECTOR_ENABLED}
      JWT_SECRET: ${JWT_SECRET}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      LLM_PROVIDER: ${LLM_PROVIDER}
      LLM_MODEL: ${LLM_MODEL}
      LLM_BASE_URL: ${LLM_BASE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
  frontend:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.frontend
    ports:
      - "5147:80"
    depends_on:
      api:
        condition: service_healthy
  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.backend
    command: ["python", "-m", "backend.app.worker"]
    environment:
      APP_NAME: HR Talent Matching Platform
      APP_ENV: ${APP_ENV}
      DATABASE_URL: postgresql+psycopg://hr_tool:${POSTGRES_PASSWORD}@db:5432/hr_tool
      PGVECTOR_ENABLED: ${PGVECTOR_ENABLED}
      JWT_SECRET: ${JWT_SECRET}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      LLM_PROVIDER:  ${LLM_PROVIDER}
      LLM_MODEL: ${LLM_MODEL}
      LLM_BASE_URL: ${LLM_BASE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
